name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  notes-check:
    name: Notes check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Run notes check
        run: node scripts/ci-check.mjs
