name: Deploy (disabled — cut over to paper2everything)

# DISABLED: Cloud Run deploys have moved from this repository to the monorepo
# yeungsinchun/paper2everything (see PR https://github.com/yeungsinchun/paper2everything/pull/1
# and its stacked cutover PR). The monorepo's .github/workflows/deploy-notes.yml
# now builds paper2notes/notes and rolls out to the SAME existing Cloud Run
# service/region (paper2notes-site / asia-east2 /
# https://paper2notes-152505675251.asia-east2.run.app/) so the public URL
# keeps working. This workflow's `push` trigger has been removed so merges to
# main in this repo no longer deploy, and the job is guarded with `if: false`
# so even a manual `workflow_dispatch` does not roll out. Delete this file
# entirely after the cutover is verified and the WIF/secrets have been moved
# to paper2everything.

on:
  workflow_dispatch:

concurrency:
  group: deploy-cloudrun
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: false
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.site.outputs.url }}
    env:
      GCP_PROJECT_ID: paper2notes-site
      GCP_REGION: asia-east2
      GCP_RUN_SERVICE: paper2notes
      GCP_AR_REPOSITORY: paper2notes
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Build, push and roll out
        run: deploy/cloudrun/deploy.sh

      - name: Record site address
        id: site
        run: |
          url="$(gcloud run services describe "$GCP_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --format='value(status.url)')"
          echo "url=$url/book5/" >> "$GITHUB_OUTPUT"
