# nginx server block for the paper2notes container (Cloud Run sends traffic
# to $PORT, which is 8080 for this service).
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # notes/ has no top-level index; Book 5 is the only book so far.
    location = / {
        return 302 /book5/;
    }

    # Vendored libraries never change in place.
    location ~ ^/book5/(vendor|.*/js/lib)/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
